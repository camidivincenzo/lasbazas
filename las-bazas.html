<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Las Bazas — Anotador</title>
<style>
  :root{
    --bg-1:#10141b;
    --bg-2:#171d27;
    --surface:#1b222d;
    --surface-2:rgba(255,255,255,0.05);
    --border:rgba(255,255,255,0.08);
    --text:#eef1f6;
    --text-muted:#8b93a3;
    --accent:#f5b731;
    --accent-ink:#1c1406;
    --accent-2:#33d1b0;
    --accent-2-ink:#062420;
    --danger:#ff6b6b;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse 900px 500px at 50% -10%, #223047 0%, transparent 60%),
      linear-gradient(180deg, var(--bg-1) 0%, var(--bg-2) 100%);
    background-attachment:fixed;
    min-height:100vh;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    color:var(--text);
    padding: 32px 14px 100px;
  }
  .wrap{max-width:680px;margin:0 auto;}

  header.title{
    text-align:center;
    margin-bottom:26px;
  }
  header.title h1{
    font-size:2.3rem;
    font-weight:800;
    letter-spacing:-0.02em;
    margin:0;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  header.title p{
    color:var(--text-muted);
    margin:8px 0 0;
    font-size:0.95rem;
    font-weight:500;
  }

  .paper{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:16px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.35);
    padding: 20px;
    position:relative;
    margin-bottom:16px;
  }
  .paper h2{
    margin:0 0 14px;
    font-size:0.85rem;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:0.06em;
    color:var(--text-muted);
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:10px;
  }
  .section-label{
    letter-spacing:0.06em;
  }

  /* Players */
  .players-list{
    display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px;
  }
  .player-chip{
    display:flex; align-items:center; gap:8px;
    background:var(--surface-2);
    border:1px solid var(--border);
    border-radius:999px;
    padding:6px 8px 6px 14px;
    font-size:0.92rem;
    font-weight:600;
  }
  .player-chip button{
    background:none; border:none; cursor:pointer;
    color:var(--text-muted); font-size:0.95rem; line-height:1;
    padding:4px 6px;
    border-radius:999px;
    font-family:inherit;
  }
  .player-chip button:hover{ color:var(--danger); }
  .player-chip button.confirming{
    background:var(--danger); color:#fff;
  }
  .add-player-row{
    display:flex; gap:8px;
  }
  .add-player-row input{
    flex:1;
    font-family:inherit;
    font-size:0.95rem;
    padding:10px 14px;
    border:1px solid var(--border);
    border-radius:10px;
    background:var(--surface-2);
    color:var(--text);
  }
  .add-player-row input::placeholder{ color:var(--text-muted); }
  .add-player-row input:focus, .cartas-input:focus, .num-input:focus{
    outline:none;
    box-shadow: 0 0 0 3px rgba(51,209,176,0.35);
    border-color: var(--accent-2);
  }
  .btn{
    font-family:inherit;
    font-size:0.9rem;
    font-weight:700;
    padding:10px 18px;
    border-radius:10px;
    border:none;
    background:var(--accent);
    color:var(--accent-ink);
    cursor:pointer;
  }
  .btn:hover{ filter:brightness(1.08); }
  .btn.secondary{
    background:transparent;
    color:var(--text-muted);
    border:1px solid var(--border);
    font-weight:600;
  }
  .btn.secondary:hover{ color:var(--danger); border-color:var(--danger); }
  .btn:disabled{ opacity:0.4; cursor:not-allowed; }

  .empty-msg{
    color:var(--text-muted);
    font-size:0.92rem;
    padding:6px 0;
  }

  /* Rounds */
  .round-card{ margin-bottom:14px; }
  .round-nav{ margin-bottom:14px; }
  .progress-track{
    height:5px;
    border-radius:999px;
    background:var(--surface-2);
    overflow:hidden;
    margin-bottom:12px;
  }
  .progress-fill{
    height:100%;
    border-radius:999px;
    background:linear-gradient(90deg, var(--accent), var(--accent-2));
    transition:width 0.25s ease;
  }
  .round-nav-row{
    display:flex; align-items:center; justify-content:space-between;
    gap:10px;
  }
  .nav-btn{ flex:0 0 auto; min-width:100px; }
  .round-counter{
    font-size:0.85rem;
    font-weight:700;
    color:var(--text-muted);
    white-space:nowrap;
  }
  .round-head{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:12px;
    flex-wrap:wrap; gap:8px;
  }
  .round-head .titlebox{ display:flex; align-items:center; gap:10px; }
  .round-head h3{ margin:0; font-size:1.05rem; font-weight:700; }
  .cartas-input{
    width:52px;
    font-family:inherit;
    font-size:0.85rem;
    padding:4px 6px;
    border:1px solid var(--border);
    border-radius:6px;
    background:var(--surface-2);
    color:var(--text);
    text-align:center;
  }
  .cartas-label{
    font-size:0.78rem; color:var(--text-muted); font-weight:600;
    background:var(--surface-2);
    padding:3px 10px;
    border-radius:999px;
  }
  .mod-badge{
    font-size:0.72rem;
    font-weight:700;
    background:var(--accent);
    color:var(--accent-ink);
    padding:3px 10px;
    border-radius:999px;
    white-space:nowrap;
  }
  .mod-badge.sin-triunfo{
    background:var(--accent-2);
    color:var(--accent-2-ink);
  }
  .bet-info{
    font-size:0.82rem;
    color:var(--text-muted);
    margin-bottom:12px;
    padding:8px 12px;
    background:var(--surface-2);
    border-radius:8px;
  }
  .bet-info.warn{
    color:var(--accent);
    background:rgba(245,183,49,0.12);
    font-weight:600;
  }
  .bet-info.error{
    color:var(--danger);
    background:rgba(255,107,107,0.12);
    font-weight:700;
  }
  .input-invalid{
    border-color:var(--danger) !important;
    box-shadow: 0 0 0 2px rgba(255,107,107,0.25) !important;
  }

  table.score-table{
    width:100%;
    border-collapse:collapse;
    font-size:0.95rem;
  }
  table.score-table th{
    text-align:left;
    font-weight:600;
    color:var(--text-muted);
    font-size:0.75rem;
    padding-bottom:8px;
    border-bottom:1px solid var(--border);
  }
  table.score-table th.num, table.score-table td.num{ text-align:center; }
  table.score-table td{
    padding:8px 4px;
    border-bottom:1px solid var(--border);
    vertical-align:middle;
  }
  table.score-table tr:last-child td{ border-bottom:none; }
  table.score-table td.name{ font-size:0.95rem; font-weight:600; }
  .num-input{
    width:44px;
    font-family:inherit;
    font-variant-numeric: tabular-nums;
    font-size:0.95rem;
    text-align:center;
    padding:6px 2px;
    border:1px solid var(--border);
    border-radius:8px;
    background:var(--surface-2);
    color:var(--text);
  }
  .num-input[data-role="puntos"]{
    font-weight:700;
    color:var(--text);
  }

  .round-footer{
    display:flex; justify-content:flex-end; margin-top:6px;
  }

  .add-round-row{ text-align:center; margin: 18px 0; }

  /* Totals sticky footer */
  .totals-bar{
    position:fixed; left:0; right:0; bottom:0;
    background: rgba(16,20,27,0.85);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-top:1px solid var(--border);
    padding:12px 14px;
    display:flex; gap:20px; overflow-x:auto;
    box-shadow: 0 -8px 24px rgba(0,0,0,0.4);
  }
  .totals-bar .empty{ color:var(--text-muted); margin:auto; font-size:0.9rem;}
  .total-item{
    display:flex; flex-direction:column; align-items:center;
    min-width:60px;
    color:var(--text);
  }
  .total-item .rank{ font-size:0.68rem; color:var(--text-muted); font-weight:700; }
  .total-item .name{ font-size:0.82rem; white-space:nowrap; color:var(--text-muted); font-weight:600; }
  .total-item .score{
    font-variant-numeric: tabular-nums;
    font-size:1.3rem; font-weight:800;
  }
  .total-item.leader .score{ color:var(--accent); }

  @media (max-width:480px){
    header.title h1{ font-size:1.8rem; }
    .paper{ padding:16px; }
    .num-input{ width:36px; }
    .nav-btn{ min-width:0; padding:10px 12px; font-size:0.85rem; }
    .round-counter{ font-size:0.78rem; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="title">
    <h1>Las Bazas</h1>
    <p>Que gane el mejor</p>
  </header>

  <div class="paper" id="room-screen" style="display:none;">
    <h2><span class="section-label">Empezar a jugar</span></h2>
    <p class="empty-msg">Creá una partida nueva para tu familia, o unite con el código que te pasaron.</p>
    <button class="btn" id="create-room-btn" style="width:100%; margin-bottom:16px;">Crear partida nueva</button>
    <div class="add-player-row">
      <input type="text" id="join-code-input" placeholder="Código de partida">
      <button class="btn secondary" id="join-room-btn">Unirme</button>
    </div>
    <div class="empty-msg" id="room-screen-msg" style="margin-top:10px;"></div>
  </div>

  <div id="app-content" style="display:none;">
    <div class="paper" id="room-info-panel">
      <h2><span class="section-label">Esta partida</span></h2>
      <div style="display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;">
        <span style="font-size:0.95rem;">Código: <strong id="room-code-display" style="font-variant-numeric:tabular-nums;"></strong></span>
        <div style="display:flex; gap:8px;">
          <button class="btn secondary" id="copy-room-btn">Copiar código</button>
          <button class="btn secondary" id="refresh-room-btn">Actualizar</button>
          <button class="btn secondary" id="leave-room-btn">Salir</button>
        </div>
      </div>
    </div>

    <div class="paper" id="players-panel">
      <h2><span class="section-label">Jugadores</span></h2>
      <div class="players-list" id="players-list"></div>
      <div class="add-player-row">
        <input type="text" id="new-player-input" placeholder="Nombre del jugador" maxlength="20">
        <button class="btn" id="add-player-btn">Agregar</button>
      </div>
    </div>

    <div id="rounds-container"></div>

    <div class="add-round-row" id="add-round-row" style="display:none;">
      <button class="btn secondary" id="reset-btn">Reiniciar puntajes</button>
    </div>
  </div>
</div>

<div class="totals-bar" id="totals-bar" style="display:none;"></div>

<script>
const KVDB_URL = 'https://kvdb.io/';
const ROOM_KEY = 'bazas-room-code';
const POLL_INTERVAL_MS = 10000;

// Secuencia fija de rondas del juego: cantidad de cartas y variante de cada mano.
const ROUND_TEMPLATE = [
  { cartas: 1 },
  { cartas: 2 },
  { cartas: 3 },
  { cartas: 4 },
  { cartas: 5 },
  { cartas: 6 },
  { cartas: 7, mod: 'con triunfo' },
  { cartas: 7, mod: 'sin triunfo' },
  { cartas: 7, mod: 'con triunfo' },
  { cartas: 6 },
  { cartas: 5 },
  { cartas: 4 },
  { cartas: 3 },
  { cartas: 2 },
  { cartas: 1 },
  { cartas: 1, mod: 'sin ver' }
];

let state = { players: [], rounds: [], currentRoundIndex: 0 };
let confirmingDeletePlayer = null;
let confirmingDeleteRound = null;
let room = localStorage.getItem(ROOM_KEY) || null;
let lastSyncedJson = null;
let pollTimer = null;

function uid(){ return 'id-' + Math.random().toString(36).slice(2,10) + Date.now().toString(36); }

function showRoomScreen(msg){
  document.getElementById('room-screen').style.display = 'block';
  document.getElementById('app-content').style.display = 'none';
  document.getElementById('totals-bar').style.display = 'none';
  document.getElementById('room-screen-msg').textContent = msg || '';
}

function showAppScreen(){
  document.getElementById('room-screen').style.display = 'none';
  document.getElementById('app-content').style.display = 'block';
  document.getElementById('totals-bar').style.display = 'flex';
  document.getElementById('room-code-display').textContent = room;
}

async function loadState(){
  if(!room){ showRoomScreen(); return; }
  try{
    const res = await fetch(KVDB_URL + room + '/state');
    if(res.ok){
      const text = await res.text();
      const parsed = JSON.parse(text);
      if(parsed && Array.isArray(parsed.players) && Array.isArray(parsed.rounds)){
        state = parsed;
        if(typeof state.currentRoundIndex !== 'number') state.currentRoundIndex = 0;
        lastSyncedJson = text;
      }
    }
    // Si da 404, es una partida nueva: seguimos con el estado vacío.
  }catch(e){
    // Sin conexión por ahora; mostramos igual la app con lo que haya en memoria.
  }
  showAppScreen();
  render();
  startPolling();
}

let saveTimeout = null;
function saveState(){
  clearTimeout(saveTimeout);
  saveTimeout = setTimeout(pushRemoteState, 500);
}

async function pushRemoteState(){
  if(!room) return;
  const json = JSON.stringify(state);
  try{
    await fetch(KVDB_URL + room + '/state', { method:'PUT', body: json });
    lastSyncedJson = json;
  }catch(e){
    console.error('No se pudo guardar la partida en el servidor', e);
  }
}

function startPolling(){
  clearInterval(pollTimer);
  pollTimer = setInterval(async ()=>{
    if(!room) return;
    const active = document.activeElement;
    if(active && active.tagName === 'INPUT') return; // no interrumpir mientras alguien escribe
    try{
      const res = await fetch(KVDB_URL + room + '/state');
      if(!res.ok) return;
      const text = await res.text();
      if(text === lastSyncedJson) return;
      const parsed = JSON.parse(text);
      if(parsed && Array.isArray(parsed.players) && Array.isArray(parsed.rounds)){
        state = parsed;
        if(typeof state.currentRoundIndex !== 'number') state.currentRoundIndex = 0;
        lastSyncedJson = text;
        render();
      }
    }catch(e){
      // problema de red pasajero; se reintenta en el próximo ciclo
    }
  }, POLL_INTERVAL_MS);
}

document.getElementById('create-room-btn').addEventListener('click', async () => {
  const btn = document.getElementById('create-room-btn');
  btn.disabled = true;
  btn.textContent = 'Creando…';
  try{
    const res = await fetch(KVDB_URL, {
      method: 'POST',
      body: new URLSearchParams({ default_ttl: '31536000' })
    });
    if(!res.ok) throw new Error('create failed');
    const bucketId = (await res.text()).trim();
    room = bucketId;
    localStorage.setItem(ROOM_KEY, room);
    state = { players: [], rounds: [], currentRoundIndex: 0 };
    lastSyncedJson = null;
    showAppScreen();
    render();
    startPolling();
  }catch(e){
    document.getElementById('room-screen-msg').textContent = 'No se pudo crear la partida. Revisá tu conexión e intentá de nuevo.';
  }
  btn.disabled = false;
  btn.textContent = 'Crear partida nueva';
});

document.getElementById('join-room-btn').addEventListener('click', () => {
  const input = document.getElementById('join-code-input');
  const code = input.value.trim();
  if(!code) return;
  room = code;
  localStorage.setItem(ROOM_KEY, room);
  loadState();
});

document.getElementById('leave-room-btn').addEventListener('click', () => {
  localStorage.removeItem(ROOM_KEY);
  room = null;
  clearInterval(pollTimer);
  state = { players: [], rounds: [], currentRoundIndex: 0 };
  document.getElementById('join-code-input').value = '';
  showRoomScreen();
});

document.getElementById('refresh-room-btn').addEventListener('click', async () => {
  if(!room) return;
  try{
    const res = await fetch(KVDB_URL + room + '/state');
    if(res.ok){
      const text = await res.text();
      if(text !== lastSyncedJson){
        const parsed = JSON.parse(text);
        if(parsed && Array.isArray(parsed.players) && Array.isArray(parsed.rounds)){
          state = parsed;
          if(typeof state.currentRoundIndex !== 'number') state.currentRoundIndex = 0;
          lastSyncedJson = text;
          render();
        }
      }
    }
  }catch(e){ /* sin conexión por ahora */ }
});

document.getElementById('copy-room-btn').addEventListener('click', () => {
  const btn = document.getElementById('copy-room-btn');
  navigator.clipboard.writeText(room).then(() => {
    const old = btn.textContent;
    btn.textContent = '¡Copiado!';
    setTimeout(() => { btn.textContent = old; }, 1500);
  });
});

function totalsByPlayer(){
  const totals = {};
  state.players.forEach(p => totals[p.id] = 0);
  state.rounds.forEach(r => {
    state.players.forEach(p => {
      const bet = r.bets[p.id];
      if(!bet || bet.puntos === '' || bet.puntos === null || bet.puntos === undefined) return;
      const pts = Number(bet.puntos);
      if(!Number.isNaN(pts)) totals[p.id] += pts;
    });
  });
  return totals;
}

function ensureRounds(){
  if(state.rounds.length === ROUND_TEMPLATE.length) return;
  if(state.players.length < 2) return;
  state.rounds = ROUND_TEMPLATE.map(t => {
    const bets = {};
    state.players.forEach(p => bets[p.id] = { apuesta:'', puntos:'' });
    return { id: uid(), cartas: t.cartas, mod: t.mod || '', bets };
  });
  saveState();
}

function render(){
  ensureRounds();
  if(state.rounds.length > 0){
    if(state.currentRoundIndex < 0) state.currentRoundIndex = 0;
    if(state.currentRoundIndex > state.rounds.length - 1) state.currentRoundIndex = state.rounds.length - 1;
  }
  renderPlayers();
  renderRounds();
  renderTotals();
  document.getElementById('add-round-row').style.display = state.players.length >= 2 ? 'block' : 'none';
}

function renderPlayers(){
  const list = document.getElementById('players-list');
  list.innerHTML = '';
  if(state.players.length === 0){
    const msg = document.createElement('div');
    msg.className = 'empty-msg';
    msg.textContent = 'Agregá al menos 2 jugadores para empezar.';
    list.appendChild(msg);
  }
  state.players.forEach(p => {
    const chip = document.createElement('div');
    chip.className = 'player-chip';
    const nameSpan = document.createElement('span');
    nameSpan.textContent = p.name;
    const delBtn = document.createElement('button');
    delBtn.textContent = confirmingDeletePlayer === p.id ? 'confirmar ✕' : '✕';
    if(confirmingDeletePlayer === p.id) delBtn.classList.add('confirming');
    delBtn.onclick = () => {
      if(confirmingDeletePlayer === p.id){
        state.players = state.players.filter(pl => pl.id !== p.id);
        state.rounds.forEach(r => { delete r.bets[p.id]; });
        confirmingDeletePlayer = null;
        saveState();
        render();
      } else {
        confirmingDeletePlayer = p.id;
        render();
      }
    };
    chip.appendChild(nameSpan);
    chip.appendChild(delBtn);
    list.appendChild(chip);
  });

  document.getElementById('add-player-btn').onclick = addPlayer;
  const input = document.getElementById('new-player-input');
  input.onkeydown = (e) => { if(e.key === 'Enter') addPlayer(); };
}

function addPlayer(){
  const input = document.getElementById('new-player-input');
  const name = input.value.trim();
  if(!name) return;
  const player = { id: uid(), name };
  state.players.push(player);
  state.rounds.forEach(r => { r.bets[player.id] = { apuesta:'', puntos:'' }; });
  input.value = '';
  confirmingDeletePlayer = null;
  saveState();
  render();
  document.getElementById('new-player-input').focus();
}

function goToRound(idx){
  if(idx < 0 || idx > state.rounds.length - 1) return;
  state.currentRoundIndex = idx;
  saveState();
  renderRounds();
  renderTotals();
}

function renderRounds(){
  const container = document.getElementById('rounds-container');
  container.innerHTML = '';
  if(state.rounds.length === 0){
    if(state.players.length >= 2){
      const p = document.createElement('div');
      p.className = 'paper';
      p.innerHTML = '<div class="empty-msg">Preparando las 16 manos de la partida…</div>';
      container.appendChild(p);
    }
    return;
  }

  const idx = state.currentRoundIndex;
  const round = state.rounds[idx];
  const total = state.rounds.length;

  const nav = document.createElement('div');
  nav.className = 'round-nav';
  const progress = document.createElement('div');
  progress.className = 'progress-track';
  const fill = document.createElement('div');
  fill.className = 'progress-fill';
  fill.style.width = (((idx+1) / total) * 100) + '%';
  progress.appendChild(fill);
  nav.appendChild(progress);

  const navRow = document.createElement('div');
  navRow.className = 'round-nav-row';
  const prevBtn = document.createElement('button');
  prevBtn.className = 'btn secondary nav-btn';
  prevBtn.textContent = '‹ Anterior';
  prevBtn.disabled = idx === 0;
  prevBtn.onclick = () => goToRound(idx - 1);
  const counter = document.createElement('span');
  counter.className = 'round-counter';
  counter.textContent = 'Mano ' + (idx+1) + ' de ' + total;
  const nextBtn = document.createElement('button');
  nextBtn.className = 'btn nav-btn';
  nextBtn.textContent = 'Siguiente ›';
  nextBtn.disabled = idx === total - 1;
  nextBtn.onclick = () => goToRound(idx + 1);
  navRow.appendChild(prevBtn);
  navRow.appendChild(counter);
  navRow.appendChild(nextBtn);
  nav.appendChild(navRow);
  container.appendChild(nav);

  const panel = document.createElement('div');
  panel.className = 'paper round-card';

  const head = document.createElement('div');
  head.className = 'round-head';

  const titlebox = document.createElement('div');
  titlebox.className = 'titlebox';
  const h3 = document.createElement('h3');
  h3.textContent = 'Mano ' + (idx+1);
  titlebox.appendChild(h3);

  const cartasLabel = document.createElement('span');
  cartasLabel.className = 'cartas-label';
  cartasLabel.textContent = round.cartas + (round.cartas === 1 ? ' carta' : ' cartas');
  titlebox.appendChild(cartasLabel);

  if(round.mod){
    const badge = document.createElement('span');
    badge.className = 'mod-badge' + (round.mod === 'sin triunfo' ? ' sin-triunfo' : '');
    badge.textContent = round.mod;
    titlebox.appendChild(badge);
  }
  head.appendChild(titlebox);
  panel.appendChild(head);

  const betInfo = document.createElement('div');
  betInfo.className = 'bet-info';
  panel.appendChild(betInfo);

  const table = document.createElement('table');
  table.className = 'score-table';
  table.innerHTML = '<thead><tr><th>Jugador</th><th class="num">Apuesta</th><th class="num">Puntos</th></tr></thead>';
  const tbody = document.createElement('tbody');

  state.players.forEach(p => {
    if(!round.bets[p.id]) round.bets[p.id] = { apuesta:'', puntos:'' };
    const bet = round.bets[p.id];
    const tr = document.createElement('tr');

    const tdName = document.createElement('td');
    tdName.className = 'name';
    tdName.textContent = p.name;
    tr.appendChild(tdName);

    const tdApuesta = document.createElement('td');
    tdApuesta.className = 'num';
    const inpApuesta = document.createElement('input');
    inpApuesta.type = 'number';
    inpApuesta.min = '0';
    inpApuesta.className = 'num-input';
    inpApuesta.dataset.role = 'apuesta';
    inpApuesta.dataset.playerId = p.id;
    inpApuesta.value = bet.apuesta;
    inpApuesta.oninput = (e) => { bet.apuesta = e.target.value; saveState(); renderBetInfo(round, panel); renderTotals(); };
    tdApuesta.appendChild(inpApuesta);
    tr.appendChild(tdApuesta);

    const tdPuntos = document.createElement('td');
    tdPuntos.className = 'num';
    const inpPuntos = document.createElement('input');
    inpPuntos.type = 'number';
    inpPuntos.className = 'num-input';
    inpPuntos.dataset.role = 'puntos';
    inpPuntos.value = bet.puntos;
    inpPuntos.oninput = (e) => { bet.puntos = e.target.value; saveState(); renderTotals(); };
    tdPuntos.appendChild(inpPuntos);
    tr.appendChild(tdPuntos);

    tbody.appendChild(tr);
  });

  table.appendChild(tbody);
  panel.appendChild(table);
  container.appendChild(panel);
  renderBetInfo(round, panel);

  document.getElementById('reset-btn').onclick = resetScores;
}

function renderBetInfo(round, panel){
  const info = panel.querySelector('.bet-info');
  if(!info) return;

  panel.querySelectorAll('.num-input[data-role="apuesta"]').forEach(inp => inp.classList.remove('input-invalid'));
  info.classList.remove('warn', 'error');

  let sum = 0, countEntered = 0;
  const pending = [];
  state.players.forEach(p => {
    const bet = round.bets[p.id];
    if(bet && bet.apuesta !== ''){
      sum += Number(bet.apuesta) || 0;
      countEntered++;
    } else {
      pending.push(p);
    }
  });
  const disponibles = round.cartas - sum;
  const unidad = round.cartas === 1 ? 'carta' : 'cartas';

  if(countEntered === 0){
    info.textContent = 'Nadie apostó todavía en esta mano de ' + round.cartas + ' ' + unidad + '.';
    return;
  }

  if(pending.length === 0){
    if(sum === round.cartas){
      info.textContent = '⚠ La suma de apuestas (' + sum + ') no puede ser igual a las ' + round.cartas + ' cartas repartidas. Alguien tiene que cambiar su apuesta.';
      info.classList.add('error');
      panel.querySelectorAll('.num-input[data-role="apuesta"]').forEach(inp => inp.classList.add('input-invalid'));
    } else {
      info.textContent = 'Apostaron un total de ' + sum + ' de ' + round.cartas + ' ' + unidad + '.';
    }
    return;
  }

  let text = 'Llevan apostadas ' + sum + ' de ' + round.cartas + ' ' + unidad + '.';
  if(pending.length === 1 && disponibles >= 0){
    text += ' A ' + pending[0].name + ' no le puede tocar apostar ' + disponibles + '.';
    info.classList.add('warn');
  } else if(pending.length > 1){
    text += ' Faltan ' + pending.length + ' jugadores por apostar.';
  }
  info.textContent = text;
}

function resetScores(){
  if(confirmingDeleteRound === 'RESET_ALL'){
    state.rounds.forEach(r => {
      state.players.forEach(p => { r.bets[p.id] = { apuesta:'', puntos:'' }; });
    });
    state.currentRoundIndex = 0;
    confirmingDeleteRound = null;
    saveState();
    render();
  } else {
    confirmingDeleteRound = 'RESET_ALL';
    const btn = document.getElementById('reset-btn');
    btn.textContent = 'Confirmar reinicio';
    setTimeout(() => {
      if(confirmingDeleteRound === 'RESET_ALL'){
        confirmingDeleteRound = null;
        render();
      }
    }, 3000);
  }
}

function renderTotals(){
  const bar = document.getElementById('totals-bar');
  bar.innerHTML = '';
  if(state.players.length === 0){
    const e = document.createElement('div');
    e.className = 'empty';
    e.textContent = 'Los totales aparecen acá una vez que agregues jugadores.';
    bar.appendChild(e);
    return;
  }
  const totals = totalsByPlayer();
  const ranked = state.players
    .map(p => ({ ...p, score: totals[p.id] || 0 }))
    .sort((a,b) => b.score - a.score);
  const topScore = ranked.length ? ranked[0].score : 0;
  ranked.forEach((p, i) => {
    const item = document.createElement('div');
    item.className = 'total-item' + (p.score === topScore && p.score > 0 ? ' leader' : '');
    item.innerHTML = '<span class="rank">#' + (i+1) + '</span>' +
      '<span class="name">' + escapeHtml(p.name) + '</span>' +
      '<span class="score">' + p.score + '</span>';
    bar.appendChild(item);
  });
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

loadState();
</script>
</body>
</html>
